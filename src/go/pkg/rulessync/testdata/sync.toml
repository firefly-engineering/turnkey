# Generated by turnkey - do not edit manually
# This file configures tk sync to keep dependency files up-to-date.
#
# The [[languages]], and the [[deps]] and [[wrappers]] rules of each
# enabled language, come from turnkey's language records
# (nix/buck2/languages.nix) and the buck2 options in your flake.nix.
# tk sync runs the [[deps]] rules in this order.
#
# To customize, modify your flake.nix buck2 options.

[conditions]
go_tags = ["integration"]
settings = "toolchains//conditions"

[[conditions.platforms]]
cpu = "x86_64"
os = "linux"

[[conditions.platforms]]
cpu = "arm64"
os = "linux"

[[conditions.platforms]]
cpu = "x86_64"
os = "macos"

[[conditions.platforms]]
cpu = "arm64"
os = "macos"

[[deps]]
generator = ["godeps-gen", "--go-mod", "go.mod", "--go-sum", "go.sum", "--prefetch"]
name = "go"
sources = ["go.mod", "go.sum"]
target = "go-deps.toml"

[[deps]]
generator = ["rustdeps-gen", "--cargo-lock", "Cargo.lock"]
name = "rust"
sources = ["Cargo.toml", "Cargo.lock"]
target = "rust-deps.toml"

[[deps]]
generator = ["uv", "export", "--all-packages", "--no-dev", "--format", "pylock.toml", "--quiet"]
name = "pylock"
sources = ["pyproject.toml", "uv.lock"]
target = "pylock.toml"

[[deps]]
generator = ["pydeps-gen", "--lock", "pylock.toml", "--uv-lock", "uv.lock"]
name = "python"
sources = ["pylock.toml", "uv.lock"]
target = "python-deps.toml"

[[deps]]
generator = ["jsdeps-gen", "--lock", "pnpm-lock.yaml"]
name = "javascript"
sources = ["pnpm-lock.yaml"]
target = "js-deps.toml"

[[deps]]
generator = ["soldeps-gen", "--foundry", "foundry.toml", "--package-json", "package.json", "--pnpm-lock", "pnpm-lock.yaml"]
name = "solidity"
sources = ["foundry.toml", "package.json", "pnpm-lock.yaml"]
target = "solidity-deps.toml"

[[languages]]
cell = "godeps"
deps_file = "go-deps.toml"
name = "go"

[[languages]]
cell = "rustdeps"
deps_file = "rust-deps.toml"
name = "rust"

[[languages]]
cell = "pydeps"
deps_file = "python-deps.toml"
name = "python"

[[languages]]
cell = "jsdeps"
deps_file = "js-deps.toml"
name = "javascript"

[[languages]]
cell = "soldeps"
deps_file = "solidity-deps.toml"
name = "solidity"

[rules]
auto_sync = true
enabled = true
strict = false

[[wrappers]]
command = "go"
deps_rule = "go"
mutating_subcommands = ["get", "mod"]
name = "go"
post_commands = ["go mod tidy"]
watch_files = ["go.mod", "go.sum"]

[[wrappers]]
command = "cargo"
deps_rule = "rust"
mutating_subcommands = ["add", "remove", "update"]
name = "cargo"
watch_files = ["Cargo.toml", "Cargo.lock"]

[[wrappers]]
command = "uv"
deps_rule = "pylock"
mutating_subcommands = ["add", "remove", "lock", "sync"]
name = "uv"
watch_files = ["pyproject.toml", "uv.lock"]
