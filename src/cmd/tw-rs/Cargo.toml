[package]
name = "tw-rs"
version = "0.1.0"
edition.workspace = true
description = "The turnkey wrapper for native language tools, syncing the deps files they change"

# The binary is named after the tool it ports
[[bin]]
name = "tw"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gostd.workspace = true
project-sync.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
