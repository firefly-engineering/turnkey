[package]
name = "godeps-gen-rs"
version = "0.1.0"
edition.workspace = true
description = "Generate go-deps.toml from a Go module or workspace for Buck2/Nix integration"

# The binary is named after the tool it ports
[[bin]]
name = "godeps-gen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
deps-gen-kit.workspace = true
gomod.workspace = true
gostd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
