[package]
name = "rust-rules-gen"
version = "0.1.0"
edition.workspace = true
description = "Generate one vendored Rust crate's rules.star from its package slice"

[[bin]]
name = "rust-rules-gen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
