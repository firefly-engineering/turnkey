# Manual feature overrides for Rust dependencies
#
# Format:
#   [overrides]
#   crate-name = ["feature1", "feature2"]     # Complete replacement
#   crate-name = { add = ["feature"] }        # Add to computed features
#   crate-name = { remove = ["feature"] }     # Never enable (with what it enables)
#
# The unifier resolves features from the workspace members' own dependency
# specs (recorded in rust-deps.toml as [[requested]]), so an override is only
# needed where it and Cargo disagree.

[overrides]
