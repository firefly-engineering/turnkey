# The dependency graph of a uv.lock of popular packages, for the pydeps-cell
# parity cases (../../pydeps-cell.toml): 126 packages, with their markers
# and extras as pydeps-gen records them. Written by
#
#   uv lock && uv export --format pylock.toml -o pylock.toml --no-dev
#   pydeps-gen --no-prefetch --lock pylock.toml --uv-lock uv.lock
#
# for a pyproject.toml with requires-python = ">=3.9" and [tool.uv]
# package = false, whose dependencies are:
#
#   requests[socks], httpx[http2,brotli], rich, pytest, black, ipython,
#   pandas, aiohttp, click, jsonschema[format], keyring, uvicorn[standard],
#   fastapi, sqlalchemy[asyncio], tqdm, psutil, virtualenv, trio,
#   anyio[trio], watchfiles, cryptography, matplotlib, scipy,
#   "importlib-metadata; python_version < '3.10'",
#   "pywin32; sys_platform == 'win32'", "uvloop; sys_platform != 'win32'"
#
# with the version, hash and url of each package dropped: pydeps-cell
# doesn't read them.

