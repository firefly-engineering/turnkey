[[cases]]
name = "markers"
description = "markers on the CPU (keyed config//cpu: or on the combined settings), the platform, the implementation, in and not in, ~=, ===, .*, string comparisons, extras normalized, a duplicate and a self dependency"
files."work/python-deps.toml" = '''

[deps.app]
dependencies = [
  { name = "common" },
  { name = "x86-only", marker = "platform_machine == 'x86_64'" },
  { name = "arm-linux", marker = "platform_machine == 'aarch64'" },
  { name = "arm-any", marker = "platform_machine == 'aarch64' or platform_machine == 'arm64'" },
  { name = "darwin-arm", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { name = "posix", marker = "os_name == 'posix' and platform_system != 'Windows'" },
  { name = "pypy", marker = "platform_python_implementation == 'PyPy'" },
  { name = "release", marker = "platform_release >= '5'" },
  { name = "in-platform", marker = "'linux' in sys_platform or 'dar' in sys_platform" },
  { name = "not-in", marker = "'win' not in sys_platform" },
  { name = "approx", marker = "python_version ~= '3.12'" },
  { name = "identity", marker = "python_full_version === '3.13.12'" },
  { name = "wild", marker = "python_full_version != '3.13.*'" },
  { name = "string-version", marker = "python_version > 'x'" },
  { name = "common" },
  { name = "app" },
]
requested_extras = ["Socks_Proxy", "missing"]

[deps.app.extras]
Socks_Proxy = [
  { name = "socks", marker = "extra == 'socks-proxy'" },
  { name = "other-extra", marker = "extra == 'other'" },
  { name = "socks-linux", marker = "extra == 'SOCKS.proxy' and sys_platform == 'linux'" },
]

[deps.common]
[deps.x86-only]
[deps.arm-linux]
[deps.arm-any]
[deps.darwin-arm]
[deps.posix]
[deps.pypy]
[deps.release]
[deps.in-platform]
[deps.not-in]
[deps.approx]
[deps.identity]
[deps.wild]
[deps.string-version]
[deps.socks]
[deps.other-extra]
[deps.socks-linux]
'''
