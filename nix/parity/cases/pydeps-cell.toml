# pydeps-cell: the pydeps cell's rules.star files, from python-deps.toml.
#
# pydeps-cell runs inside the Python deps-cell derivation
# (nix/lib/deps-cell/adapters/python.nix) as
#
#   pydeps-cell $out <python-deps.toml>
#
# once the packages are merged into the cell: $out/pydeps-cell.json holds
# the platforms and the Python version, as the derivation writes it
# (builtins.toJSON of nix/buck2/platforms.nix's conditions plus
# python_version), and $out/vendor/<name>/ each package, with the
# rules.star mkPythonDepPackage wrote, which pydeps-cell replaces. Each
# case lays that out under out/ and compares the whole cell.
#
# The port adds `rust = "<package>"` below; its switch deletes this file.

[tool]
go = "pydeps-cell-go"
bin = "pydeps-cell"
rust = "pydeps-cell-rs"


[[cases]]
name = "turnkey-python-deps"
description = "turnkey's own python-deps.toml, for the default platforms"
inputs = { "work/python-deps.toml" = "python-deps.toml" }
files."out/pydeps-cell.json" = "{\"platforms\":[{\"cpu\":\"x86_64\",\"os\":\"linux\"},{\"cpu\":\"arm64\",\"os\":\"linux\"},{\"cpu\":\"x86_64\",\"os\":\"macos\"},{\"cpu\":\"arm64\",\"os\":\"macos\"}],\"python_version\":\"3.13.12\",\"settings\":\"toolchains//conditions\"}\n"
files."out/vendor/six/rules.star" = "# Auto-generated by turnkey deps-cell\nload(\"@prelude//:rules.bzl\", \"python_library\")\n\npython_library(\n    name = \"six\",\n    srcs = glob([\"**/*.py\"]),\n    base_module = \"\",\n    visibility = [\"PUBLIC\"],\n)\n\n"
args = ["{out}", "{work}/python-deps.toml"]
exit = 0
outputs = [{ path = "out" }]

[[cases]]
name = "e2e-multi-language"
description = "the multi-language fixture's python-deps.toml, as pydeps-gen writes it (--no-prefetch) from its pylock.toml and uv.lock"
files."work/python-deps.toml" = '''
# Auto-generated by pydeps-gen from pylock.toml. Do not edit.
# To regenerate: tk sync

schema_version = 2

[deps.six]
version = "1.17.0"
hash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
url = "https://files.pythonhosted.org/packages/94/e7/b2c673351809dca68a0e064b6af791aa332cf192da575fd474ed7d6f16a2/six-1.17.0.tar.gz"
'''
files."out/pydeps-cell.json" = "{\"platforms\":[{\"cpu\":\"x86_64\",\"os\":\"linux\"},{\"cpu\":\"arm64\",\"os\":\"linux\"},{\"cpu\":\"x86_64\",\"os\":\"macos\"},{\"cpu\":\"arm64\",\"os\":\"macos\"}],\"python_version\":\"3.13.12\",\"settings\":\"toolchains//conditions\"}\n"
files."out/vendor/six/rules.star" = "# Auto-generated by turnkey deps-cell\nload(\"@prelude//:rules.bzl\", \"python_library\")\n\npython_library(\n    name = \"six\",\n    srcs = glob([\"**/*.py\"]),\n    base_module = \"\",\n    visibility = [\"PUBLIC\"],\n)\n\n"
args = ["{out}", "{work}/python-deps.toml"]
exit = 0
outputs = [{ path = "out" }]

[[cases]]
name = "go-test-deps"
description = "src/go/pkg/pydepscell's test deps: a Linux-only dependency, Windows-only and old-Python ones dropped, a requested extra's in, an unvendored one out"
files."work/python-deps.toml" = '''

[deps.pytest]
dependencies = [
  { name = "iniconfig" },
  { name = "colorama", marker = "sys_platform == 'win32'" },
  { name = "exceptiongroup", marker = "python_version < '3.11'" },
  { name = "uvloop", marker = "sys_platform == 'linux'" },
  { name = "notvendored" },
]
requested_extras = ["testing"]

[deps.pytest.extras]
testing = [{ name = "hypothesis", marker = "extra == 'testing'" }]
other = [{ name = "xmlschema" }]

[deps.iniconfig]
[deps.colorama]
[deps.exceptiongroup]
[deps.uvloop]
[deps.hypothesis]
[deps.xmlschema]
'''
files."out/pydeps-cell.json" = "{\"platforms\":[{\"cpu\":\"x86_64\",\"os\":\"linux\"},{\"cpu\":\"arm64\",\"os\":\"linux\"},{\"cpu\":\"x86_64\",\"os\":\"macos\"},{\"cpu\":\"arm64\",\"os\":\"macos\"}],\"python_version\":\"3.13.12\",\"settings\":\"toolchains//conditions\"}\n"
files."out/vendor/pytest/rules.star" = ""
files."out/vendor/iniconfig/rules.star" = ""
files."out/vendor/colorama/rules.star" = ""
files."out/vendor/exceptiongroup/rules.star" = ""
files."out/vendor/uvloop/rules.star" = ""
files."out/vendor/hypothesis/rules.star" = ""
files."out/vendor/xmlschema/rules.star" = ""
args = ["{out}", "{work}/python-deps.toml"]
exit = 0
outputs = [{ path = "out" }]

