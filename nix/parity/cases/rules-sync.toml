files."work/pyproject.toml" = "[project]\nname = \"root\"\n\n[tool.uv.workspace]\nmembers = [\"src/app\"]\n"
files."work/python-deps.toml" = "schema_version = 2\n\n[deps.requests]\n[deps.oldlib]\n[deps.extradep]\n"
files."work/src/app/app/__init__.py" = "import requests\nimport oldlib\nimport unknownmod\n"
files."work/src/app/pyproject.toml" = "[project]\nname = \"app\"\ndependencies = [\n    \"requests ; sys_platform == \\\"linux\\\"\",\n    \"oldlib ; python_version < \\\"3.10\\\"\",\n]\n\n[project.optional-dependencies]\nx = [\"extradep\"]\n"
files."work/src/app/rules.star" = "python_library(\n    name = \"app\",\n    deps = [],\n)\n\npython_library(\n    name = \"app-x\",\n    extras = [\"x\"],\n    deps = [],\n)\n"
args = ["--project-root", "{work}", "--force"]
env = { GOTOOLCHAIN = "local", GOPROXY = "off", GONOSUMDB = "*" }
exit = 0
timeout = 1200
outputs = [{ stream = "stdout" }]

