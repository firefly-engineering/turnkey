files."work/.turnkey/sync.toml" = "# Generated by turnkey - do not edit manually\n# This file configures tk sync to keep dependency files up-to-date.\n#\n# The [[languages]], and the [[deps]] and [[wrappers]] rules of each\n# enabled language, come from turnkey's language records\n# (nix/buck2/languages.nix) and the buck2 options in your flake.nix.\n# tk sync runs the [[deps]] rules in this order.\n#\n# To customize, modify your flake.nix buck2 options.\n\n[conditions]\ngo_tags = [\"integration\"]\nsettings = \"toolchains//conditions\"\n\n[[conditions.platforms]]\ncpu = \"x86_64\"\nos = \"linux\"\n\n[[conditions.platforms]]\ncpu = \"arm64\"\nos = \"linux\"\n\n[[conditions.platforms]]\ncpu = \"x86_64\"\nos = \"macos\"\n\n[[conditions.platforms]]\ncpu = \"arm64\"\nos = \"macos\"\n\n[[deps]]\ngenerator = [\"godeps-gen\", \"--go-mod\", \"go.mod\", \"--go-sum\", \"go.sum\"]\nname = \"go\"\nsources = [\"go.mod\", \"go.sum\"]\ntarget = \"go-deps.toml\"\n\n[[deps]]\ngenerator = [\"rustdeps-gen\", \"--cargo-lock\", \"Cargo.lock\", \"--platform\", \"linux-x86_64=x86_64-unknown-linux-gnu\", \"--platform\", \"linux-arm64=aarch64-unknown-linux-gnu\", \"--platform\", \"macos-x86_64=x86_64-apple-darwin\", \"--platform\", \"macos-arm64=aarch64-apple-darwin\"]\nname = \"rust\"\nsources = [\"Cargo.toml\", \"Cargo.lock\"]\ntarget = \"rust-deps.toml\"\ntarget_sources = \"manifests\"\n\n[[deps]]\ngenerator = [\"uv\", \"export\", \"--all-packages\", \"--no-dev\", \"--format\", \"pylock.toml\", \"--quiet\"]\nname = \"pylock\"\nsources = [\"pyproject.toml\", \"uv.lock\"]\ntarget = \"pylock.toml\"\n\n[[deps]]\ngenerator = [\"pydeps-gen\", \"--lock\", \"pylock.toml\", \"--uv-lock\", \"uv.lock\"]\nname = \"python\"\nsources = [\"pylock.toml\", \"uv.lock\"]\ntarget = \"python-deps.toml\"\n\n[[deps]]\ngenerator = [\"jsdeps-gen\", \"--lock\", \"pnpm-lock.yaml\"]\nname = \"javascript\"\nsources = [\"pnpm-lock.yaml\"]\ntarget = \"js-deps.toml\"\n\n[[deps]]\ngenerator = [\"soldeps-gen\", \"--package-json\", \"package.json\", \"--pnpm-lock\", \"pnpm-lock.yaml\", \"--previous\", \"solidity-deps.toml\", \"--foundry\", \"foundry.toml\", \"--vendor-dir\", \".turnkey/soldeps/vendor/\"]\nname = \"solidity\"\nsources = [\"foundry.toml\", \"package.json\", \"pnpm-lock.yaml\"]\ntarget = \"solidity-deps.toml\"\n\n[[deps]]\ngenerator = [\"soldeps-gen\", \"remappings\", \"--deps\", \"solidity-deps.toml\", \"--foundry\", \"foundry.toml\", \"--vendor-dir\", \".turnkey/soldeps/vendor/\"]\nname = \"solidity-remappings\"\nsources = [\"solidity-deps.toml\"]\ntarget = \"remappings.txt\"\n\n[[languages]]\ncell = \"godeps\"\ndeps_file = \"go-deps.toml\"\nname = \"go\"\n\n[[languages]]\ncell = \"rustdeps\"\ndeps_file = \"rust-deps.toml\"\nname = \"rust\"\n\n[[languages]]\ncell = \"pydeps\"\ndeps_file = \"python-deps.toml\"\nname = \"python\"\n\n[[languages]]\ncell = \"jsdeps\"\ndeps_file = \"js-deps.toml\"\nname = \"javascript\"\n\n[[languages]]\ncell = \"soldeps\"\ndeps_file = \"solidity-deps.toml\"\nname = \"solidity\"\n\n[rules]\nauto_sync = true\nenabled = true\nstrict = false\n\n[[wrappers]]\ncommand = \"go\"\ndeps_rule = \"go\"\nmutating_subcommands = [\"get\", \"mod\"]\nname = \"go\"\npost_commands = [\"go mod tidy\"]\nwatch_files = [\"go.mod\", \"go.sum\"]\n\n[[wrappers]]\ncommand = \"cargo\"\ndeps_rule = \"rust\"\nmutating_subcommands = [\"add\", \"remove\", \"update\"]\nname = \"cargo\"\nwatch_files = [\"Cargo.toml\", \"Cargo.lock\"]\n\n[[wrappers]]\ncommand = \"uv\"\ndeps_rule = \"pylock\"\nmutating_subcommands = [\"add\", \"remove\", \"lock\", \"sync\"]\nname = \"uv\"\nwatch_files = [\"pyproject.toml\", \"uv.lock\"]\n"
