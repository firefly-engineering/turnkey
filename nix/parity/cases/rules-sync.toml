# Parity cases for rules-sync and its Rust port (#215): rules sync run on
# turnkey's own tree, made stale in various ways, on the e2e fixtures and on
# the Go tests' fixtures. Every rules.star rewritten is compared byte for
# byte, and so is the JSON report on stdout. Generated paths in the report
# are each side's scratch root, normalised.
#
# The tool's PATH has go and git (nix/parity/default.nix), and deps-extract
# and python3 for the Python, TypeScript and Solidity plug-ins. go runs
# offline (GOPROXY=off): it lists imports from the sources and the module
# cache, the same on both sides.

[tool]
go = "rules-sync"
rust = "rules-sync-rs"

[[cases]]
name = "turnkey-as-is"
description = "turnkey, as committed, synced with --force --dry-run: every rules.star read, none changed"
inputs = { work = "." }
exclude = ["target", ".turnkey", "node_modules", "__pycache__", ".venv"]
files."work/.turnkey/sync.toml" = "# Generated by turnkey - do not edit manually\n# This file configures tk sync to keep dependency files up-to-date.\n#\n# The [[languages]], and the [[deps]] and [[wrappers]] rules of each\n# enabled language, come from turnkey's language records\n# (nix/buck2/languages.nix) and the buck2 options in your flake.nix.\n# tk sync runs the [[deps]] rules in this order.\n#\n# To customize, modify your flake.nix buck2 options.\n\n[conditions]\ngo_tags = [\"integration\"]\nsettings = \"toolchains//conditions\"\n\n[[conditions.platforms]]\ncpu = \"x86_64\"\nos = \"linux\"\n\n[[conditions.platforms]]\ncpu = \"arm64\"\nos = \"linux\"\n\n[[conditions.platforms]]\ncpu = \"x86_64\"\nos = \"macos\"\n\n[[conditions.platforms]]\ncpu = \"arm64\"\nos = \"macos\"\n\n[[deps]]\ngenerator = [\"godeps-gen\", \"--go-mod\", \"go.mod\", \"--go-sum\", \"go.sum\"]\nname = \"go\"\nsources = [\"go.mod\", \"go.sum\"]\ntarget = \"go-deps.toml\"\n\n[[deps]]\ngenerator = [\"rustdeps-gen\", \"--cargo-lock\", \"Cargo.lock\", \"--platform\", \"linux-x86_64=x86_64-unknown-linux-gnu\", \"--platform\", \"linux-arm64=aarch64-unknown-linux-gnu\", \"--platform\", \"macos-x86_64=x86_64-apple-darwin\", \"--platform\", \"macos-arm64=aarch64-apple-darwin\"]\nname = \"rust\"\nsources = [\"Cargo.toml\", \"Cargo.lock\"]\ntarget = \"rust-deps.toml\"\ntarget_sources = \"manifests\"\n\n[[deps]]\ngenerator = [\"uv\", \"export\", \"--all-packages\", \"--no-dev\", \"--format\", \"pylock.toml\", \"--quiet\"]\nname = \"pylock\"\nsources = [\"pyproject.toml\", \"uv.lock\"]\ntarget = \"pylock.toml\"\n\n[[deps]]\ngenerator = [\"pydeps-gen\", \"--lock\", \"pylock.toml\", \"--uv-lock\", \"uv.lock\"]\nname = \"python\"\nsources = [\"pylock.toml\", \"uv.lock\"]\ntarget = \"python-deps.toml\"\n\n[[deps]]\ngenerator = [\"jsdeps-gen\", \"--lock\", \"pnpm-lock.yaml\"]\nname = \"javascript\"\nsources = [\"pnpm-lock.yaml\"]\ntarget = \"js-deps.toml\"\n\n[[deps]]\ngenerator = [\"soldeps-gen\", \"--package-json\", \"package.json\", \"--pnpm-lock\", \"pnpm-lock.yaml\", \"--previous\", \"solidity-deps.toml\", \"--foundry\", \"foundry.toml\", \"--vendor-dir\", \".turnkey/soldeps/vendor/\"]\nname = \"solidity\"\nsources = [\"foundry.toml\", \"package.json\", \"pnpm-lock.yaml\"]\ntarget = \"solidity-deps.toml\"\n\n[[deps]]\ngenerator = [\"soldeps-gen\", \"remappings\", \"--deps\", \"solidity-deps.toml\", \"--foundry\", \"foundry.toml\", \"--vendor-dir\", \".turnkey/soldeps/vendor/\"]\nname = \"solidity-remappings\"\nsources = [\"solidity-deps.toml\"]\ntarget = \"remappings.txt\"\n\n[[languages]]\ncell = \"godeps\"\ndeps_file = \"go-deps.toml\"\nname = \"go\"\n\n[[languages]]\ncell = \"rustdeps\"\ndeps_file = \"rust-deps.toml\"\nname = \"rust\"\n\n[[languages]]\ncell = \"pydeps\"\ndeps_file = \"python-deps.toml\"\nname = \"python\"\n\n[[languages]]\ncell = \"jsdeps\"\ndeps_file = \"js-deps.toml\"\nname = \"javascript\"\n\n[[languages]]\ncell = \"soldeps\"\ndeps_file = \"solidity-deps.toml\"\nname = \"solidity\"\n\n[rules]\nauto_sync = true\nenabled = true\nstrict = false\n\n[[wrappers]]\ncommand = \"go\"\ndeps_rule = \"go\"\nmutating_subcommands = [\"get\", \"mod\"]\nname = \"go\"\npost_commands = [\"go mod tidy\"]\nwatch_files = [\"go.mod\", \"go.sum\"]\n\n[[wrappers]]\ncommand = \"cargo\"\ndeps_rule = \"rust\"\nmutating_subcommands = [\"add\", \"remove\", \"update\"]\nname = \"cargo\"\nwatch_files = [\"Cargo.toml\", \"Cargo.lock\"]\n\n[[wrappers]]\ncommand = \"uv\"\ndeps_rule = \"pylock\"\nmutating_subcommands = [\"add\", \"remove\", \"lock\", \"sync\"]\nname = \"uv\"\nwatch_files = [\"pyproject.toml\", \"uv.lock\"]\n"
args = ["--project-root", "{work}", "--force", "--dry-run"]
env = { GOTOOLCHAIN = "local", GOPROXY = "off", GONOSUMDB = "*" }
exit = 0
timeout = 1200
outputs = [{ stream = "stdout" }]

[[cases]]
name = "turnkey-stale"
description = "turnkey with rules.star files made stale (deps missing, extra, reordered, emptied; a select() target; npm_deps; a Python member), synced with --force"
inputs = { work = "." }
exclude = ["target", ".turnkey", "node_modules", "__pycache__", ".venv"]
files."work/.turnkey/sync.toml" = "# Generated by turnkey - do not edit manually\n# This file configures tk sync to keep dependency files up-to-date.\n#\n# The [[languages]], and the [[deps]] and [[wrappers]] rules of each\n# enabled language, come from turnkey's language records\n# (nix/buck2/languages.nix) and the buck2 options in your flake.nix.\n# tk sync runs the [[deps]] rules in this order.\n#\n# To customize, modify your flake.nix buck2 options.\n\n[conditions]\ngo_tags = [\"integration\"]\nsettings = \"toolchains//conditions\"\n\n[[conditions.platforms]]\ncpu = \"x86_64\"\nos = \"linux\"\n\n[[conditions.platforms]]\ncpu = \"arm64\"\nos = \"linux\"\n\n[[conditions.platforms]]\ncpu = \"x86_64\"\nos = \"macos\"\n\n[[conditions.platforms]]\ncpu = \"arm64\"\nos = \"macos\"\n\n[[deps]]\ngenerator = [\"godeps-gen\", \"--go-mod\", \"go.mod\", \"--go-sum\", \"go.sum\"]\nname = \"go\"\nsources = [\"go.mod\", \"go.sum\"]\ntarget = \"go-deps.toml\"\n\n[[deps]]\ngenerator = [\"rustdeps-gen\", \"--cargo-lock\", \"Cargo.lock\", \"--platform\", \"linux-x86_64=x86_64-unknown-linux-gnu\", \"--platform\", \"linux-arm64=aarch64-unknown-linux-gnu\", \"--platform\", \"macos-x86_64=x86_64-apple-darwin\", \"--platform\", \"macos-arm64=aarch64-apple-darwin\"]\nname = \"rust\"\nsources = [\"Cargo.toml\", \"Cargo.lock\"]\ntarget = \"rust-deps.toml\"\ntarget_sources = \"manifests\"\n\n[[deps]]\ngenerator = [\"uv\", \"export\", \"--all-packages\", \"--no-dev\", \"--format\", \"pylock.toml\", \"--quiet\"]\nname = \"pylock\"\nsources = [\"pyproject.toml\", \"uv.lock\"]\ntarget = \"pylock.toml\"\n\n[[deps]]\ngenerator = [\"pydeps-gen\", \"--lock\", \"pylock.toml\", \"--uv-lock\", \"uv.lock\"]\nname = \"python\"\nsources = [\"pylock.toml\", \"uv.lock\"]\ntarget = \"python-deps.toml\"\n\n[[deps]]\ngenerator = [\"jsdeps-gen\", \"--lock\", \"pnpm-lock.yaml\"]\nname = \"javascript\"\nsources = [\"pnpm-lock.yaml\"]\ntarget = \"js-deps.toml\"\n\n[[deps]]\ngenerator = [\"soldeps-gen\", \"--package-json\", \"package.json\", \"--pnpm-lock\", \"pnpm-lock.yaml\", \"--previous\", \"solidity-deps.toml\", \"--foundry\", \"foundry.toml\", \"--vendor-dir\", \".turnkey/soldeps/vendor/\"]\nname = \"solidity\"\nsources = [\"foundry.toml\", \"package.json\", \"pnpm-lock.yaml\"]\ntarget = \"solidity-deps.toml\"\n\n[[deps]]\ngenerator = [\"soldeps-gen\", \"remappings\", \"--deps\", \"solidity-deps.toml\", \"--foundry\", \"foundry.toml\", \"--vendor-dir\", \".turnkey/soldeps/vendor/\"]\nname = \"solidity-remappings\"\nsources = [\"solidity-deps.toml\"]\ntarget = \"remappings.txt\"\n\n[[languages]]\ncell = \"godeps\"\ndeps_file = \"go-deps.toml\"\nname = \"go\"\n\n[[languages]]\ncell = \"rustdeps\"\ndeps_file = \"rust-deps.toml\"\nname = \"rust\"\n\n[[languages]]\ncell = \"pydeps\"\ndeps_file = \"python-deps.toml\"\nname = \"python\"\n\n[[languages]]\ncell = \"jsdeps\"\ndeps_file = \"js-deps.toml\"\nname = \"javascript\"\n\n[[languages]]\ncell = \"soldeps\"\ndeps_file = \"solidity-deps.toml\"\nname = \"solidity\"\n\n[rules]\nauto_sync = true\nenabled = true\nstrict = false\n\n[[wrappers]]\ncommand = \"go\"\ndeps_rule = \"go\"\nmutating_subcommands = [\"get\", \"mod\"]\nname = \"go\"\npost_commands = [\"go mod tidy\"]\nwatch_files = [\"go.mod\", \"go.sum\"]\n\n[[wrappers]]\ncommand = \"cargo\"\ndeps_rule = \"rust\"\nmutating_subcommands = [\"add\", \"remove\", \"update\"]\nname = \"cargo\"\nwatch_files = [\"Cargo.toml\", \"Cargo.lock\"]\n\n[[wrappers]]\ncommand = \"uv\"\ndeps_rule = \"pylock\"\nmutating_subcommands = [\"add\", \"remove\", \"lock\", \"sync\"]\nname = \"uv\"\nwatch_files = [\"pyproject.toml\", \"uv.lock\"]\n"
files."work/src/cmd/check-foundry-config/rules.star" = "load(\"@prelude//:rules.bzl\", \"python_binary\", \"python_library\", \"python_test\")\n\npython_library(\n    name = \"lib\",\n    # Under the shared turnkey.* namespace, as turnkey.check_foundry_config;\n    # the on-disk layout matches, so the pre-commit hook, which runs\n    # __main__.py with python directly, imports it the same way\n    srcs = [\"turnkey/check_foundry_config.py\"],\n    base_module = \"\",\n)\n\npython_binary(\n    name = \"check-foundry-config\",\n    main = \"__main__.py\",\n    base_module = \"\",\n    visibility = [\"PUBLIC\"],\n    deps = [\"pydeps//vendor/stale:stale\"],\n)\n\npython_test(\n    name = \"test\",\n    srcs = [\"tests/test_check_foundry_config.py\"],\n    base_module = \"tests\",\n    deps = [\":lib\"],\n)\n"
files."work/src/cmd/tk/rules.star" = "# Auto-managed by turnkey. Hash: e94159bedae8df97\n# Manual sections marked with turnkey:preserve-start/end are not modified.\n\nload(\"@prelude//:rules.bzl\", \"go_binary\")\n\ngo_binary(\n    name = \"tk\",\n    srcs = glob([\"*.go\"]),\n    deps = [],\n    visibility = [\"PUBLIC\"],\n)\n"
files."work/src/examples/typescript-hello-deps/rules.star" = "# Auto-managed by turnkey. Hash: 4be24c3291bfaffe\n# Manual sections marked with turnkey:preserve-start/end are not modified.\n\nload(\"@prelude//typescript:typescript.bzl\", \"typescript_binary\")\n\ntypescript_binary(\n    name = \"typescript-hello-deps\",\n    main = \"main.ts\",\n    srcs = [\"main.ts\"],\n    npm_deps = [],\n    visibility = [\"PUBLIC\"],\n)\n"
files."work/src/go/pkg/mapper/rules.star" = "load(\"@prelude//:rules.bzl\", \"go_library\", \"go_test\")\n\ngo_library(\n    name = \"mapper\",\n    package_name = \"github.com/firefly-engineering/turnkey/src/go/pkg/mapper\",\n    srcs = glob([\"*.go\"], exclude = [\"*_test.go\"]),\n    deps = [\n        \"//src/go/pkg/conditions:conditions\",\n        \"//src/go/pkg/gone:gone\",\n        \"godeps//vendor/golang.org/x/mod/modfile:modfile\",\n    ],\n    visibility = [\"PUBLIC\"],\n)\n\ngo_test(\n    name = \"mapper_test\",\n    srcs = glob([\"*_test.go\"]),\n    target_under_test = \":mapper\",\n    deps = [\n        \"//src/go/pkg/conditions:conditions\",\n        \"//src/go/pkg/extraction:extraction\",\n        \"//src/go/pkg/starlark:starlark\",\n        \"//src/go/pkg/syncconfig:syncconfig\",\n    ],\n    visibility = [\"PUBLIC\"],\n)\n"
files."work/src/rust/composition/rules.star" = "# composition - CompositionBackend trait for FUSE and symlink backends\nload(\"@prelude//:rules.bzl\", \"rust_library\", \"rust_test\")\n\n# Base library without optional features\nrust_library(\n    name = \"composition\",\n    srcs = glob([\"src/**/*.rs\"]),\n    edition = \"2024\",\n    deps = [],\n    visibility = [\"PUBLIC\"],\n)\n\n# Full-featured library with FUSE and watcher support\n# - Linux: uses fuser crate (feature=\"fuse\")\n# - macOS: uses direct libfuse3 FFI (feature=\"fuse-t\")\n# Sync writes the features and deps these Cargo features expand to.\nrust_library(\n    name = \"composition-full\",\n    crate = \"composition\",  # Keep the original crate name for imports\n    srcs = glob([\"src/**/*.rs\"]),\n    edition = \"2024\",\n    cargo_features = [\"watcher\"] + select({\n        \"config//os:linux\": [\"fuse\"],\n        \"config//os:macos\": [\"fuse-t\"],\n    }),\n    exported_linker_flags = select({\n        \"config//os:linux\": [],\n        \"config//os:macos\": [\n            \"-L/usr/local/lib\",\n            \"-lfuse3\",\n        ],\n    }),\n    # notify is pinned to the version notify-debouncer-mini depends on\n    deps = [\n        \"//src/rust/nix-eval:nix-eval\",\n        \"rustdeps//vendor/dirs:dirs\",\n        \"rustdeps//vendor/libc:libc\",\n        \"rustdeps//vendor/log:log\",\n        \"rustdeps//vendor/notify-debouncer-mini:notify-debouncer-mini\",\n        \"rustdeps//vendor/notify@8.2.0:notify\",\n        \"rustdeps//vendor/serde:serde\",\n        \"rustdeps//vendor/serde_json:serde_json\",\n        \"rustdeps//vendor/thiserror:thiserror\",\n        \"rustdeps//vendor/toml:toml\",\n    ] + select({\n        \"config//os:linux\": [\"rustdeps//vendor/fuser:fuser\"],\n        \"config//os:macos\": [],\n    }),\n    visibility = [\"PUBLIC\"],\n    features = [\"watcher\"] + select({\n        \"config//os:linux\": [\"fuse\"],\n        \"config//os:macos\": [\"fuse-t\"],\n    }),\n)\n\nrust_test(\n    name = \"composition-test\",\n    srcs = glob([\"src/**/*.rs\"]),\n    edition = \"2024\",\n    deps = [\n        \"//src/rust/nix-eval:nix-eval\",\n        \"rustdeps//vendor/dirs:dirs\",\n        \"rustdeps//vendor/log:log\",\n        \"rustdeps//vendor/serde:serde\",\n        \"rustdeps//vendor/serde_json:serde_json\",\n        \"rustdeps//vendor/thiserror:thiserror\",\n        \"rustdeps//vendor/toml:toml\",\n        \"rustdeps//vendor/tempfile:tempfile\",\n    ],\n)\n\n# Integration tests\nrust_test(\n    name = \"integration-tests\",\n    srcs = glob([\"tests/**/*.rs\"]),\n    edition = \"2024\",\n    deps = [\n        \":composition\",\n        \"rustdeps//vendor/tempfile:tempfile\",\n    ],\n)\n"
files."work/src/rust/conditions/rules.star" = "# conditions - the build configurations deps depend on, and the select()\n# turnkey writes for them\nload(\"@prelude//:rules.bzl\", \"rust_library\", \"rust_test\")\n\nrust_library(\n    name = \"conditions\",\n    srcs = glob([\"src/**/*.rs\"]),\n    edition = \"2024\",\n    deps = [\"//src/rust/gostd:gostd\"],\n    visibility = [\"PUBLIC\"],\n)\n\nrust_test(\n    name = \"conditions-test\",\n    srcs = glob([\"src/**/*.rs\"]),\n    edition = \"2024\",\n    deps = [\n        \"//src/rust/deps-gen-kit:deps-gen-kit\",\n        \"//src/rust/gostd:gostd\",\n        \"rustdeps//vendor/serde:serde\",\n        \"rustdeps//vendor/serde_json:serde_json\",\n    ],\n    # The split cases src/go/pkg/conditions runs too, embedded from where\n    # testdata/ links to them\n    mapped_srcs = {\"//src/go/pkg/conditions:split-vectors\": \"testdata/split-vectors.json\"},\n)\n"
files."work/src/rust/rules-star/rules.star" = "# rules-star - rules.star files read, edited and written back, rewriting\n# only what changed\nload(\"@prelude//:rules.bzl\", \"rust_library\", \"rust_test\")\n\nrust_library(\n    name = \"rules-star\",\n    srcs = glob([\"src/**/*.rs\"]),\n    edition = \"2024\",\n    deps = [\n        \"rustdeps//vendor/starlark_syntax:starlark_syntax\",\n        \"//src/rust/gostd:gostd\",\n        \"//src/rust/deps-gen-kit:deps-gen-kit\",\n        \"//src/rust/conditions:conditions\",\n    ],\n    visibility = [\"PUBLIC\"],\n)\n\nrust_test(\n    name = \"rules-star-test\",\n    srcs = glob([\"src/**/*.rs\"]),\n    edition = \"2024\",\n    deps = [\n        \"//src/rust/conditions:conditions\",\n        \"//src/rust/deps-gen-kit:deps-gen-kit\",\n        \"//src/rust/gostd:gostd\",\n        \"rustdeps//vendor/serde:serde\",\n        \"rustdeps//vendor/serde_json:serde_json\",\n        \"rustdeps//vendor/starlark_syntax:starlark_syntax\",\n    ],\n    # The syntax trees src/go/pkg/starlark checks against go.starlark.net,\n    # embedded from where testdata/ links to them\n    mapped_srcs = {\"//src/go/pkg/starlark:syntax-vectors\": \"testdata/syntax-vectors.json\"},\n)\n"
args = ["--project-root", "{work}", "--force", "--", "{work}"]
env = { GOTOOLCHAIN = "local", GOPROXY = "off", GONOSUMDB = "*" }
exit = 0
timeout = 1200
outputs = [{ stream = "stdout" }]

