# buckgen: the rules.star files of one Go module, written in place.
#
# buckgen runs inside each Go module's derivation (mkGoDepPackage in
# nix/lib/deps-cell/adapters/go.nix) as
#
#   buckgen --config "$buckgenConfigPath" --module-path <module path> \
#     --targets-out $targets --imports-out $imports $out
#
# with $out the module's source as its zip unpacks (with its fixup, user
# patches and assembly headers) and buckgen.json what mkBuckgenConfig
# writes (builtins.toJSON: sorted keys, no newline). Each case lays the
# module out under out/ and the configuration in work/, and compares the
# cell contents (out), --targets-out and --imports-out byte for byte.
#
# The real modules' cases read the module zips' unpacked sources from the
# Nix store: fetchzip outputs, fixed-output, so their paths are the same
# everywhere. They are there once turnkey's Go deps cell (the dev shell)
# and the go-coverage fixture's (./e2e/harness/runner.sh go-coverage) have
# been built; GOROOT's trees are the Go toolchain's.
#
# The port adds `rust = "<package>"` below; its switch deletes this file.

[tool]
go = "buckgen"
rust = "buckgen-rs"


[[cases]]
name = "turnkey-golang-org-x-sys"
description = "golang.org/x/sys, from turnkey's Go deps cell, as mkGoDepPackage runs buckgen on it"
inputs = { "out" = "/nix/store/wnpsghsa7002pbvhcyqq9zp1h9b4byx3-source/x/sys@v0.40.0" }
files."work/buckgen.json" = "{\"buck\":{\"buildfile_name\":\"rules.star\",\"deps_attr\":\"deps\",\"deps_target_label_prefix\":\"godeps//vendor/\",\"go_library_rule\":\"go_library\",\"preambule\":\"# Auto-generated by turnkey buckgen\\n\"},\"conditions\":{\"go_tags\":[],\"platforms\":[{\"cpu\":\"x86_64\",\"os\":\"linux\"},{\"cpu\":\"arm64\",\"os\":\"linux\"},{\"cpu\":\"x86_64\",\"os\":\"macos\"},{\"cpu\":\"arm64\",\"os\":\"macos\"}],\"settings\":\"toolchains//conditions\"},\"go_version\":\"1.26\"}"
args = ["--config", "{work}/buckgen.json", "--module-path", "golang.org/x/sys", "--targets-out", "{work}/targets", "--imports-out", "{work}/imports", "{out}"]
exit = 0
outputs = [{ path = "out" }, { path = "work/targets" }, { path = "work/imports" }]

