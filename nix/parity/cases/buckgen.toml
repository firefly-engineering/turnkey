files."work/buckgen.json" = "{\"buck\":{\"buildfile_name\":\"sub\",\"deps_attr\":\"deps\",\"deps_target_label_prefix\":\"godeps//vendor/\",\"go_library_rule\":\"go_library\",\"preambule\":\"# Auto-generated by turnkey buckgen\\n\"},\"conditions\":{\"go_tags\":[],\"platforms\":[{\"cpu\":\"x86_64\",\"os\":\"linux\"},{\"cpu\":\"arm64\",\"os\":\"linux\"},{\"cpu\":\"x86_64\",\"os\":\"macos\"},{\"cpu\":\"arm64\",\"os\":\"macos\"}],\"settings\":\"toolchains//conditions\"},\"go_version\":\"1.26\"}"
files."out/a/a.go" = "package a\n"
files."out/b/b.go" = "package b\n"
files."out/b/sub/s.go" = "package sub\n"
