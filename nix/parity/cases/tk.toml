description = "tk rules bogus: exit 1"
inputs = { work = "e2e/fixtures/greenfield-go" }
exclude = ["target", ".turnkey", "node_modules", "__pycache__", ".venv"]
files."work/.turnkey/sync.toml" = "[[deps]]\nname = \"go\"\nsources = [\"go.mod\", \"go.sum\"]\ntarget = \"go-deps.toml\"\ngenerator = [\"godeps-gen\", \"--go-mod\", \"go.mod\", \"--go-sum\", \"go.sum\"]\n\n[[deps]]\nname = \"derived\"\nsources = [\"go-deps.toml\"]\ntarget = \"derived.txt\"\ngenerator = [\"rustdeps-gen\", \"--derived\"]\n\n[[languages]]\nname = \"go\"\ncell = \"godeps\"\ndeps_file = \"go-deps.toml\"\n"
args = ["rules", "bogus"]
env = { GOTOOLCHAIN = "local", GOPROXY = "off", GONOSUMDB = "*" }
exit = 1
outputs = [
  { stream = "stdout" },
]

[[cases.stubs.buck2]]
args = ["completion", "bash"]
stdout = "# @generated by `buck2 completion bash`\n_buck2() {\n    case \"${cmd},${i}\" in\n        \",buck2)\"\n            cmd=\"buck2\"\n            ;;\n        buck2,completion)\n            cmd=\"buck2__completion\"\n            ;;\n    esac\n    opts=\"-v -h -V --isolation-dir completion docs\"\n}\ncomplete -F _buck2 -o bashdefault -o default buck2\n"

[[cases.stubs.buck2]]
args = ["kill"]
stdout = "killed buck2 daemon\n"

[[cases.stubs.buck2]]
stdout = "buck2 ran\n"
exit = 0

[[cases.stubs.godeps-gen]]
stdout = "# Auto-generated by godeps-gen\n\nschema_version = 2\n\nsources = [\n    \"go.mod\",\n    \"go.sum\",\n]\n\n[deps.\"github.com/google/uuid@v1.6.0\"]\nimport_path = \"github.com/google/uuid\"\nversion = \"v1.6.0\"\nhash = \"sha256-Oz3yds86lLivFbfBZNWKBB+WTSu3h/GlIplzIG+0OqE=\"\n"
exit = 0

[[cases.stubs.rustdeps-gen]]
stdout = "derived\n"

[[cases.stubs.nix-store]]

