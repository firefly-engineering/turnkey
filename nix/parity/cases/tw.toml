target = "python-deps.toml"

[[languages]]
cell = "godeps"
deps_file = "go-deps.toml"
name = "go"

[[languages]]
cell = "rustdeps"
deps_file = "rust-deps.toml"
name = "rust"

[[languages]]
cell = "pydeps"
deps_file = "python-deps.toml"
name = "python"

[rules]
auto_sync = true
enabled = true
strict = false

[[wrappers]]
command = "go"
