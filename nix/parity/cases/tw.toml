name = "go"
post_commands = ["go mod tidy"]
watch_files = ["go.work", "go.work.sum", "go.mod", "go.sum"]

[[wrappers]]
command = "cargo"
deps_rule = "rust"
mutating_subcommands = ["add", "remove", "update"]
name = "cargo"
watch_files = ["rust_lib/Cargo.toml", "rust_lib/Cargo.lock"]

[[wrappers]]
command = "uv"
deps_rule = "pylock"
mutating_subcommands = ["add", "remove", "lock", "sync"]
name = "uv"
watch_files = ["python_app/pyproject.toml", "python_app/uv.lock"]
"""
files."work/go-deps.toml" = "sources = [\"go.mod\", \"go.sum\"]\n"
cwd = "work/python_app"
args = ["uv", "add", "requests"]
exit = 0
outputs = [
  { stream = "stdout" },
  { path = "work/python_app/pylock.toml" },
  { path = "work/python-deps.toml" },
  { path = "work/rust-deps.toml" },
]

[[cases.stubs.uv]]
args_prefix = ["add"]
write."work/python_app/uv.lock" = "version = 1\n# requests added\n"

[[cases.stubs.uv]]
args_prefix = ["export"]
stdout = "lock-version = \"1.0\"\n"

[[cases.stubs.pydeps-gen]]
stdout = "schema_version = 1\n"

[[cases.stubs.rustdeps-gen]]
stdout = "manifests = [\"rust_lib/Cargo.toml\"]\n"

[[cases.stubs.godeps-gen]]

[[cases]]
name = "multi-language-cargo-add"
description = "cargo add from the crate: the rust rule syncs, listing its manifests, then nothing else is stale"
inputs = { work = "e2e/fixtures/multi-language" }
files."work/.turnkey/sync.toml" = """
[[deps]]
generator = ["godeps-gen"]
name = "go"
sources = ["go.work", "go.work.sum", "go.mod", "go.sum"]
target = "go-deps.toml"
target_sources = "sources"

[[deps]]
generator = ["rustdeps-gen", "--cargo-lock", "rust_lib/Cargo.lock"]
name = "rust"
sources = ["rust_lib/Cargo.toml", "rust_lib/Cargo.lock"]
target = "rust-deps.toml"
target_sources = "manifests"

[[wrappers]]
command = "cargo"
deps_rule = "rust"
mutating_subcommands = ["add", "remove", "update"]
name = "cargo"
watch_files = ["rust_lib/Cargo.toml", "rust_lib/Cargo.lock"]
"""
files."work/go-deps.toml" = "sources = [\"go.mod\", \"go.sum\"]\n"
cwd = "work/rust_lib/src"
args = ["-v", "cargo", "add", "serde"]
exit = 0
outputs = [{ stream = "stdout" }, { path = "work/rust-deps.toml" }]

[[cases.stubs.cargo]]
args_prefix = ["add"]
write."work/rust_lib/Cargo.toml" = "[package]\nname = \"rust_lib\"\n\n[dependencies]\nserde = \"1\"\n"

[[cases.stubs.rustdeps-gen]]
stdout = "manifests = [\"rust_lib/Cargo.toml\"]\n"

[[cases.stubs.godeps-gen]]

