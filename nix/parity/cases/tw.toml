[[cases]]
name = "sync-staleness-rules"
description = "after the rule syncs, every rule is checked: fresh, sourceless, glob and ** sources, target_sources listed or not, a bad pattern"
inputs = { work = "e2e/fixtures/go-coverage" }
files."work/.turnkey/sync.toml" = """
[[deps]]
name = "go"
sources = ["go.work", "go.work.sum"]
target = "go-deps.toml"
generator = ["gen", "go"]

# Fresh: its source and target have the same mtime
[[deps]]
name = "fresh"
sources = ["app/go.sum"]
target = "fresh.txt"
generator = ["gen", "fresh"]

# None of its sources exists: skipped
[[deps]]
name = "sourceless"
sources = ["missing.txt", "also-missing/*.txt"]
target = "sourceless.txt"
generator = ["gen", "sourceless"]

# A glob matching the changed go.work: stale
[[deps]]
name = "glob"
sources = ["*.work", "app/*.sum"]
target = "glob.txt"
generator = ["gen", "glob"]

# ** over the Go files, with an existing target of the same age: fresh
[[deps]]
name = "doublestar-fresh"
sources = ["lib/**/*.go"]
target = "ds-fresh.txt"
generator = ["gen", "doublestar-fresh"]

# ** with a missing target: stale
[[deps]]
name = "doublestar-missing"
sources = ["**/*_test.go"]
target = "out/ds-missing.txt"
generator = ["gen", "doublestar-missing"]

# A target that doesn't list its target_sources yet: stale
[[deps]]
name = "unlisted"
sources = ["app/go.mod"]
target = "unlisted.toml"
target_sources = "manifests"
generator = ["gen", "unlisted"]

# A target listing a source the sync made newer: stale
[[deps]]
name = "listed"
sources = ["app/go.mod"]
target = "listed.toml"
target_sources = "manifests"
generator = ["gen", "listed"]

# A target listing only sources as old as it: fresh
[[deps]]
name = "listed-fresh"
sources = ["app/go.mod"]
target = "listed-fresh.toml"
target_sources = "manifests"
generator = ["gen", "listed-fresh"]

# A malformed pattern: an error, and the rules after it still run
[[deps]]
name = "bad-pattern"
sources = ["app/["]
target = "bad.txt"
generator = ["gen", "bad-pattern"]

# A target listing something that isn't a path
[[deps]]
name = "bad-listing"
sources = ["app/go.mod"]
target = "bad-listing.toml"
target_sources = "manifests"
generator = ["gen", "bad-listing"]

[[deps]]
name = "last"
sources = ["go-deps.toml"]
target = "last.txt"
generator = ["gen", "last"]

[[wrappers]]
name = "go"
command = "go"
mutating_subcommands = ["work"]
watch_files = ["go.work"]
deps_rule = "go"
"""
files."work/fresh.txt" = "fresh\n"
files."work/ds-fresh.txt" = "ds\n"
files."work/unlisted.toml" = "schema_version = 1\n"
files."work/listed.toml" = "manifests = [\"go.work\"]\n"
files."work/listed-fresh.toml" = "manifests = [\"lib/go.mod\"]\n"
files."work/bad-listing.toml" = "manifests = [1]\n"
args = ["go", "work", "use", "./lib"]
exit = 0
outputs = [
  { stream = "stdout" },
  { path = "work/go-deps.toml" },
  { path = "work/glob.txt" },
  { path = "work/out" },
  { path = "work/unlisted.toml" },
  { path = "work/listed.toml" },
  { path = "work/last.txt" },
]

[[cases.stubs.go]]
write."work/go.work" = "go 1.22\n\nuse (\n\t./app\n\t./lib\n)\n\n// touched\n"

[[cases.stubs.gen]]
args = ["unlisted"]
stdout = "manifests = []\n"

[[cases.stubs.gen]]
args = ["listed"]
stdout = "manifests = [\"go.work\"]\n"

[[cases.stubs.gen]]
stdout = "generated\n"

