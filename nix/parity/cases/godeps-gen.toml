# godeps-gen: go-deps.toml from a Go module or workspace.
#
# --no-prefetch on every case: the prefetched hashes come over the network
# (#204). go list still resolves the module graph with the real go, from
# the caller's module cache (HOME, GOMODCACHE) or the proxy.
#
# The port adds `rust = "<package>"` below; its switch deletes this file.

[tool]
go = "godeps-gen"
rust = "godeps-gen-rs"

[[cases]]
name = "testdata-simple"
description = "src/testdata/godeps/simple: one direct dependency"
inputs = { work = "src/testdata/godeps/simple" }
args = ["--no-prefetch"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 0
outputs = [{ stream = "stdout" }]

[[cases]]
name = "testdata-medium"
# The medium and edge-cases fixtures feed the Go tests' parser, not go
# list: medium's go.mod is untidy and edge-cases' go.sum is malformed, so
# godeps-gen rejects both, and the two versions must reject them alike
description = "src/testdata/godeps/medium: an untidy go.mod, which go list -mod=readonly rejects"
inputs = { work = "src/testdata/godeps/medium" }
args = ["--no-prefetch"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 1
outputs = [{ stream = "stdout" }]

[[cases]]
name = "testdata-edge-cases"
description = "src/testdata/godeps/edge-cases: a go.sum with a malformed line, which go list rejects"
inputs = { work = "src/testdata/godeps/edge-cases" }
args = ["--no-prefetch"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 1
outputs = [{ stream = "stdout" }]

[[cases]]
name = "e2e-greenfield-go"
inputs = { work = "e2e/fixtures/greenfield-go" }
args = ["--no-prefetch", "-o", "go-deps.toml"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 0
outputs = [{ path = "work/go-deps.toml" }]

[[cases]]
name = "e2e-multi-language"
inputs = { work = "e2e/fixtures/multi-language" }
args = ["--no-prefetch", "-o", "go-deps.toml"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 0
outputs = [{ path = "work/go-deps.toml" }]

[[cases]]
name = "turnkey-repo"
description = "turnkey's own module, as its go deps rule runs godeps-gen"
inputs = { work = "." }
args = ["--no-prefetch", "--go-work", "go.work", "--go-mod", "go.mod", "--go-sum", "go.sum", "-o", "go-deps.toml"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 0
outputs = [{ path = "work/go-deps.toml" }]

[[cases]]
name = "missing-go-mod"
description = "an unreadable workspace is an error"
inputs = { work = "src/testdata/godeps/simple" }
args = ["--no-prefetch", "--go-mod", "absent.mod"]
exit = 1
outputs = [{ stream = "stdout" }]

[[cases]]
name = "conflicting-flags"
description = "--no-prefetch with --no-cache is a usage error"
inputs = { work = "src/testdata/godeps/simple" }
args = ["--no-prefetch", "--no-cache"]
exit = 2
outputs = [{ stream = "stdout" }]

# A go.work workspace of two members: the greenfield module, and a tools
# module that requires it (through a local replace to the member), shares
# its uuid requirement (indirect in tools only, so direct overall), and
# adds x/mod and an indirect x/sys. Its go.sum has the lines of turnkey's
# go.sum go list and the deps file need.
[[cases]]
name = "go-work-members"
description = "a go.work workspace: members, sources, a shared and an indirect requirement, a local replace to a member"
inputs = { work = "e2e/fixtures/greenfield-go" }
files."work/tools/go.sum" = """
github.com/google/uuid v1.6.0 h1:NIvaJDMOsjHA8n1jAhLSgzrAzy1Hgr+hNrb57e+94F0=
github.com/google/uuid v1.6.0/go.mod h1:TIyPZe4MgqvfeYDBFedMoGGpEw/LqOeaOT+nhxU+yHo=
golang.org/x/mod v0.31.0 h1:HaW9xtz0+kOcWKwli0ZXy79Ix+UW/vOfmWI5QVd2tgI=
golang.org/x/mod v0.31.0/go.mod h1:43JraMp9cGx1Rx3AqioxrbrhNsLl2l/iNAvuBkrezpg=
golang.org/x/sys v0.40.0 h1:DBZZqJ2Rkml6QMQsZywtnjnnGvHza6BTfYFWY9kjEWQ=
golang.org/x/sys v0.40.0/go.mod h1:OgkHotnGiDImocRcuBABYBEXf8A9a87e/uXjp9XT3ks=
"""
files."work/go.work" = "go 1.24.0\n\nuse (\n\t.\n\t./tools\n)\n"
files."work/tools/go.mod" = """
module example.com/greenfield/tools

go 1.24.0

require (
	example.com/greenfield v0.0.0
	github.com/google/uuid v1.6.0 // indirect
	golang.org/x/mod v0.31.0
	golang.org/x/sys v0.40.0 // indirect
)

replace example.com/greenfield => ../
"""
args = ["--no-prefetch", "-o", "go-deps.toml"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 0
outputs = [{ path = "work/go-deps.toml" }]

[[cases]]
name = "go-work-members-direct-only"
description = "the same workspace with --indirect=false: x/sys, indirect everywhere, is left out"
inputs = { work = "e2e/fixtures/greenfield-go" }
files."work/tools/go.sum" = """
github.com/google/uuid v1.6.0 h1:NIvaJDMOsjHA8n1jAhLSgzrAzy1Hgr+hNrb57e+94F0=
github.com/google/uuid v1.6.0/go.mod h1:TIyPZe4MgqvfeYDBFedMoGGpEw/LqOeaOT+nhxU+yHo=
golang.org/x/mod v0.31.0 h1:HaW9xtz0+kOcWKwli0ZXy79Ix+UW/vOfmWI5QVd2tgI=
golang.org/x/mod v0.31.0/go.mod h1:43JraMp9cGx1Rx3AqioxrbrhNsLl2l/iNAvuBkrezpg=
golang.org/x/sys v0.40.0 h1:DBZZqJ2Rkml6QMQsZywtnjnnGvHza6BTfYFWY9kjEWQ=
golang.org/x/sys v0.40.0/go.mod h1:OgkHotnGiDImocRcuBABYBEXf8A9a87e/uXjp9XT3ks=
"""
files."work/go.work" = "go 1.24.0\n\nuse (\n\t.\n\t./tools\n)\n"
files."work/tools/go.mod" = """
module example.com/greenfield/tools

go 1.24.0

require (
	example.com/greenfield v0.0.0
	github.com/google/uuid v1.6.0 // indirect
	golang.org/x/mod v0.31.0
	golang.org/x/sys v0.40.0 // indirect
)

replace example.com/greenfield => ../
"""
args = ["--no-prefetch", "--indirect=false"]
env = { GOTOOLCHAIN = "local" }
inherit_env = ["GOMODCACHE", "GOPROXY", "GOPATH"]
exit = 0
outputs = [{ stream = "stdout" }]

[[cases]]
name = "local-replace-not-a-member"
description = "a local replace to a directory outside the workspace is an error, before go list runs"
inputs = { work = "e2e/fixtures/greenfield-go" }
files."work/go.mod" = "module example.com/greenfield\n\ngo 1.21\n\nrequire github.com/google/uuid v1.6.0\n\nreplace github.com/google/uuid => ./uuid\n"
files."work/uuid/go.mod" = "module github.com/google/uuid\n"
args = ["--no-prefetch"]
exit = 1
outputs = [{ stream = "stdout" }]

[[cases]]
name = "use-outside-the-project"
description = "a go.work member outside the project is an error"
inputs = { work = "e2e/fixtures/greenfield-go" }
files."work/go.work" = "go 1.24.0\n\nuse ../elsewhere\n"
args = ["--no-prefetch"]
exit = 1
outputs = [{ stream = "stdout" }]

[[cases]]
name = "invalid-go-mod"
description = "a go.mod x/mod rejects is an error"
inputs = { work = "e2e/fixtures/greenfield-go" }
files."work/go.mod" = "module example.com/greenfield\n\nrequire github.com/google/uuid 1.6.0\n"
args = ["--no-prefetch"]
exit = 1
outputs = [{ stream = "stdout" }]

[[cases]]
name = "help"
description = "-h prints the usage to stderr and exits 0"
inputs = { work = "src/testdata/godeps/simple" }
args = ["-h"]
exit = 0
outputs = [{ stream = "stdout" }]

[[cases]]
name = "unknown-flag"
description = "a flag godeps-gen doesn't define (the retired --prefetch) is a usage error"
inputs = { work = "src/testdata/godeps/simple" }
args = ["--prefetch"]
exit = 2
outputs = [{ stream = "stdout" }]
