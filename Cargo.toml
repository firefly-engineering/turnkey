# Turnkey Rust workspace
#
# This is a monorepo workspace that declares all Rust dependencies.
# Run `cargo update` to refresh Cargo.lock, then `tk sync` to regenerate
# rust-deps.toml.

[workspace]
resolver = "2"
members = [
    "src/cmd/check-rust-edition-rs",
    "src/cmd/check-source-coverage-rs",
    "src/cmd/godeps-gen",
    "src/cmd/jsdeps-gen",
    "src/cmd/nix-prefetch-cached",
    "src/cmd/pydeps-cell",
    "src/cmd/pydeps-gen",
    "src/cmd/rustdeps-gen",
    "src/cmd/rust-rules-gen",
    "src/cmd/soldeps-gen",
    "src/cmd/test-runner-codegen",
    "src/cmd/turnkey-composed",
    "src/cmd/turnkey-test-runner",
    "src/examples/rust-hello",
    "src/examples/rust-hello-deps",
    "src/rust/buck2-test-executor",
    "src/rust/composition",
    "src/rust/conditions",
    "src/rust/deps-extract",
    "src/rust/deps-gen-kit",
    "src/rust/gomod",
    "src/rust/gostd",
    "src/rust/nix-eval",
    "src/rust/pep508",
    "src/rust/prefetch-cache",
    "src/rust/starlark-parse",
]

# Shared package metadata for all workspace members
[workspace.package]
edition = "2024"

# Shared dependencies for all workspace members
# ALL dependencies must be declared here and referenced with workspace = true
[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
cargo-lock = "10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dirs = "5.0"
env_logger = "0.11"
flate2 = "1.1"
fuser = { version = "0.17", features = ["libfuse"] }
glob = "0.3"
itoa = "1.0"
libc = "0.2"
log = "0.4"
notify = "8.0"
notify-debouncer-mini = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
serde-saphyr = "0.0.15"
sha1 = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3.10"
toml = "0.8"
toml_edit = "0.25"
# gostd classifies characters as Go does: pinned to the Unicode version of
# the Go toolchain turnkey pins (unicode.Version is 15.0.0 in Go 1.26, and
# 0.1.1 is the crate's last Unicode 15.0 release). Bump the two together.
unicode-properties = { version = "=0.1.1", default-features = false, features = ["general-category"] }
ureq = { version = "2", features = ["json"] }
walkdir = "2.5"

# gRPC and protobuf (turnkey-test-runner speaks buck2's test-runner protocol
# and the Remote Execution API)
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
tonic = "0.14"
tonic-prost = "0.14"
# Without cleanup-markdown: doc comments are kept as written, and
# pulldown-cmark stays out of the build.
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

# Tree-sitter for source code parsing
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-solidity = "1.2.13"
tree-sitter-starlark = "1.3"

# Workspace member references (for path dependencies between crates)
buck2-test-executor = { path = "src/rust/buck2-test-executor" }
composition = { path = "src/rust/composition", features = ["watcher"] }
conditions = { path = "src/rust/conditions" }
deps-gen-kit = { path = "src/rust/deps-gen-kit" }
gomod = { path = "src/rust/gomod" }
gostd = { path = "src/rust/gostd" }
nix-eval = { path = "src/rust/nix-eval" }
pep508 = { path = "src/rust/pep508" }
prefetch-cache = { path = "src/rust/prefetch-cache" }
