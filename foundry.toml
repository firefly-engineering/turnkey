# The repository's one Foundry configuration.
#
# Native forge runs from any directory and covers every Solidity package under
# src/; narrow a run with --match-path 'src/examples/<name>/**'. There is no
# per-package foundry.toml (check-foundry-config rejects one).
#
# The Buck2 Solidity rules read this file too, so the settings below drive
# solidity_library and solidity_test as well as native forge.
#
# The compiler is not pinned here: the dev shell exports FOUNDRY_SOLC (the
# toolchain's solc) and FOUNDRY_OFFLINE=true, the same compiler and offline
# policy the Buck2 Solidity rules use.

[profile.default]
src = "src"
test = "src"
libs = [".turnkey/soldeps/vendor"]
out = "out"
auto_detect_remappings = false
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256

# Git dependencies, in Soldeer's table form: `version` (what fixup sets
# match on), `git`, and exactly one of `rev`, `tag` or `branch`. Turnkey
# never runs Soldeer; `tk sync` reads this table into solidity-deps.toml and
# the root remappings.txt. Only direct dependencies are followed.
#
# npm Solidity packages such as @openzeppelin/contracts come from
# package.json and pnpm-lock.yaml: a dependency counts when its tarball
# holds .sol files.
[dependencies]
forge-std = { version = "1.8.0", git = "https://github.com/foundry-rs/forge-std", tag = "v1.8.0" }
